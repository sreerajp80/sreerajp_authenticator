name: sreerajp_authenticator
description: "A modern TOTP/HOTP authenticator app"
publish_to: 'none'
version: 2.10.1+29

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter

  # Core authenticator functionality
  base32: ^2.1.3  # For base32 encoding/decoding

  # QR Code scanning
  camera: 0.12.2  # Camera preview and frames for QR scanning
  flutter_zxing: 3.1.0  # Open source QR decoding (zxing-cpp); keep mobile_scanner out

  # Database
  shared_preferences: ^2.3.3
  sqflite: ^2.3.3+2
  path: ^1.9.0

  # Security
  local_auth: ^3.0.2  # For biometric/PIN authentication
  screen_protector: ^1.5.3  # Prevent screenshots and screen recording

  # UI/UX
  provider: ^6.1.2  # State management
  flutter_slidable: ^4.0.3  # Swipe actions on tiles
  flutter_svg: ^2.0.10+1  # SVG icons support

  # Utilities
  flutter_secure_storage: ^11.2.0  # Secure storage for sensitive data
  share_plus: ^13.3.1  # For export functionality
  file_picker: ^13.3.0  # For import functionality
  permission_handler: ^13.0.2  # Handle permissions
  url_launcher: ^6.3.1  # For opening links
  qr_flutter: ^4.1.0  # For QR code generation

  # Modern UI components
  flutter_animate: ^4.5.0  # Beautiful animations

  package_info_plus: ^10.2.2

  path_provider: ^2.1.5
  encrypt: 5.0.3
  pointycastle: 3.9.1
  percent_indicator: ^4.2.3

  crypto: ^3.0.8
  material_ui: ^1.8.0  # Standalone Material package (engineering standard §6.1)
  cupertino_ui: ^1.1.4  # Cupertino fallback delegate for Sanskrit (standard §8.3.1)

  # Localization (engineering standard §8)
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1
  sqflite_common_ffi: ^2.3.4+4

flutter_launcher_icons:
  android: true
  image_path: "assets/icons/app_icon.png"

  # Android Adaptive Icon (works on Android 8.0+)
  adaptive_icon_background: "#1976D2"
  adaptive_icon_foreground: "assets/icons/app_icon_foreground.png"

  min_sdk_android: 29

flutter:
  default-flavor: dev
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/icons/brands/
    - assets/config/

  fonts:
    - family: Inter
      fonts:
        - asset: fonts/Inter-Regular.ttf
        - asset: fonts/Inter-Medium.ttf
          weight: 500
        - asset: fonts/Inter-Bold.ttf
          weight: 700
    # Script coverage for Malayalam and Sanskrit (Devanagari), SIL OFL 1.1
    - family: NotoSansMalayalam
      fonts:
        - asset: fonts/NotoSansMalayalam-Regular.ttf
        - asset: fonts/NotoSansMalayalam-Bold.ttf
          weight: 700
    - family: NotoSansDevanagari
      fonts:
        - asset: fonts/NotoSansDevanagari-Regular.ttf
        - asset: fonts/NotoSansDevanagari-Bold.ttf
          weight: 700
