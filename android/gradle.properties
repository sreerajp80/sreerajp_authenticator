org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Disable Kotlin incremental compilation — works around a known bug where the
# pub cache (H:\) and project (L:\) are on different Windows drive roots, causing
# RelocatableFileToPathConverter.toPath to fail with "different roots".
kotlin.incremental=false
# AGP compiles Kotlin itself. Check each Android plugin before changing this.
android.builtInKotlin=true
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
# Give every --split-per-abi APK the same versionCode as the App Bundle (no 1000/2000/4000
# ABI offset), so a phone with a direct APK can later update from Google Play without an
# uninstall (which would delete the vault).
force-version-code-ignoring-abi=true
